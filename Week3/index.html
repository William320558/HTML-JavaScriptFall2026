<!DOCTYPE html>  <!-- Type of html-->
<html lang="en">
    <head>
        <title>Week 3 Drawing using the HTML Canvas</title>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            #container{
                width: 800px;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
            }

        </style>
    </head>
<body>
        <div id="container">

          <h1> Week 3 lab- Drawing on the HTML Canvas</h1>
          <canvas id="canvas" width="800" height="600" style="border: 2px solid green;">
            Your browser does not support the html canvas
          </canvas>
        </div>


        <!-- In Document JavaScript -->
    <script>
        // These are the common variables for setting the canvas
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");

        //draw a sqare
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(canvas.width/2 - 25, canvas.height/2 - 25, 50, 50);

        ctx.fillStyle = "magenta";
        ctx.fillRect(750, canvas.height/2 - 300, 50, 50);

        ctx.fillStyle = "cyan";
        ctx.fillRect(750, canvas.height/2 - -250, 50, 50);

        ctx.fillStyle = "green";
        ctx.fillRect(0, canvas.height/2 - -250, 50, 50);

        ctx.fillStyle = "purple";
        ctx.fillRect(0, canvas.height/2 - 300, 50, 50);
        //Outline Box -------------------------------------------------------------------------
        ctx.strokeStyle = "orange";
        ctx.lineWidth = 5.0;
        ctx.strokeRect(750, canvas.height/2 - -250, 50, 50)
                                                                                              
        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 5.0;
        ctx.strokeRect(750, canvas.height/2 - 300, 50, 50)

        ctx.strokeStyle = "pink";
        ctx.lineWidth = 5.0;
        ctx.strokeRect(0, canvas.height/2 - -250, 50, 50)

        ctx.strokeStyle = "brown";
        ctx.lineWidth = 5.0;
        ctx.strokeRect(0, canvas.height/2 - 300, 50, 50)


        ctx.strokeStyle = "black";
        ctx.lineWidth = 5.0;
        ctx.strokeRect(canvas.width/2 - 25, canvas.height/2 - -250, 50, 50)

        //Lets draw some lines ----------------------------------------------------------------
        ctx.strokeStyle = "pink";
        ctx.lineWidth = 5.0;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(800,600);
        ctx.stroke();

        ctx.strokeStyle = "black";
        ctx.lineWidth = 5.0;
        ctx.beginPath();
        ctx.moveTo(800,0);
        ctx.lineTo(canvas.width/2 + 25, 275);
        ctx.lineTo(canvas.width/2 + 25, 325);
        ctx.lineTo(canvas.width/2 - 25, 325);
        ctx.lineTo(canvas.width/2 - 25, 275);
        ctx.lineTo(canvas.width/2 + 25, 275);
        ctx.stroke();


        //Lets draw a circle and manpac
        ctx.beginPath();
        ctx.arc(200, 300, 100, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "yellow";
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.arc(600, 300, 100,degreesToRadians(45), degreesToRadians(315));
        ctx.lineTo(600, 300);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        function degreesToRadians(degrees){
            let radian = degrees * (Math.PI/180);
           return radian;
        }

        function drawCircle(xPos, yPos, radius, startAngle, endAngle){
         ctx.beginPath();
         ctx.arc(xPos, yPos, radius, degreesToRadians(startAngle), degreesToRadians(endAngle))
         ctx.fill();
         ctx.stroke();


        }

        drawCircle(100, 10, 10, 0, 360);

        //Hoopla
    </script>
</body>
</html>
